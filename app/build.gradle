plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tvlauncher.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tvlauncher.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.6.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
