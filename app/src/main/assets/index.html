<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>TV Launcher</title>
<style>
  /* =====================================================================
     TV Launcher — стеклянный интерфейс (в духе tvOS / visionOS)
     ===================================================================== */
  :root { --accent:#4c8dff; --ease:cubic-bezier(.2,.8,.2,1); --dim:.8;
          --muted:rgba(232,238,255,.62); --text:#f5f7ff;
          --glass:rgba(255,255,255,.09); --glass-hi:rgba(255,255,255,.16);
          --stroke:rgba(255,255,255,.16); --stroke-hi:rgba(255,255,255,.55);
          --blur:blur(26px) saturate(170%); }
  /* Обои */
  body                      { --bg:#070a14; --w1:#3b5bdb; --w2:#9c36b5; --w3:#0ca678; }
  body[data-wall="sunset"]  { --bg:#12060f; --w1:#ff7a45; --w2:#d6336c; --w3:#6741d9; }
  body[data-wall="ocean"]   { --bg:#041018; --w1:#15aabf; --w2:#1c7ed6; --w3:#12b886; }
  body[data-wall="forest"]  { --bg:#050f0a; --w1:#2f9e44; --w2:#0b7285; --w3:#94d82d; }
  body[data-wall="graphite"]{ --bg:#0a0b0e; --w1:#495057; --w2:#364fc7; --w3:#868e96; }

  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#000; }
  body { color:var(--text); font-family:"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,Arial,sans-serif; overflow:hidden; -webkit-font-smoothing:antialiased; }
  svg.i { width:1em; height:1em; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  ::-webkit-scrollbar { width:8px; height:8px; } ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.2); border-radius:4px; }
  .rail::-webkit-scrollbar, .cchips::-webkit-scrollbar { display:none; }
  [tabindex]:focus { outline:none; }
  body.noanim *, body.noanim *::before, body.noanim *::after { animation:none !important; transition:none !important; }
  body.noglass * { backdrop-filter:none !important; -webkit-backdrop-filter:none !important; }
  body.noglass { --glass:rgba(40,46,66,.88); --glass-hi:rgba(60,68,92,.95); }

  #app { position:fixed; inset:0; display:flex; flex-direction:column; background:var(--bg); }

  /* ===== Обои: медленно плывущие цветные пятна ===== */
  .wall { position:absolute; inset:0; overflow:hidden; z-index:0; background:var(--bg); pointer-events:none; }
  .wall i { position:absolute; width:78vmax; height:78vmax; border-radius:50%; opacity:.6; will-change:transform; }
  .wall i:nth-child(1) { left:-22vmax; top:-34vmax; background:radial-gradient(circle, var(--w1), transparent 62%); animation:drift1 38s ease-in-out infinite alternate; }
  .wall i:nth-child(2) { right:-28vmax; top:2vmax;  background:radial-gradient(circle, var(--w2), transparent 62%); animation:drift2 46s ease-in-out infinite alternate; }
  .wall i:nth-child(3) { left:12vmax; bottom:-52vmax; background:radial-gradient(circle, var(--w3), transparent 62%); animation:drift3 54s ease-in-out infinite alternate; }
  .wall::after { content:''; position:absolute; inset:0;
                 background:radial-gradient(ellipse at 50% -10%, rgba(255,255,255,.07), transparent 60%), linear-gradient(transparent 50%, rgba(0,0,0,.38)); }
  @keyframes drift1 { to { transform:translate(20vmax, 14vmax) scale(1.14); } }
  @keyframes drift2 { to { transform:translate(-18vmax, 16vmax) scale(.9); } }
  @keyframes drift3 { to { transform:translate(16vmax, -12vmax) scale(1.18); } }

  /* ===== Включение / выключение "телевизора" ===== */
  #app.tv-on  { animation:tvOn .95s var(--ease) backwards; }
  #app.tv-off { animation:tvOff .7s ease-in forwards; }
  #app.tv-on  > * { animation:kidsIn .95s backwards; }
  #app.tv-off > * { animation:kidsOut .7s forwards; }
  @keyframes tvOn {
    0%   { transform:scale(0,.004); filter:brightness(12); background:#fff; }
    30%  { transform:scale(1,.004); filter:brightness(12); background:#fff; }
    65%  { transform:scale(1,1.02); filter:brightness(3);  background:#9aa; }
    100% { transform:scale(1,1);    filter:brightness(1);  background:var(--bg); }
  }
  @keyframes tvOff {
    0%   { transform:scale(1,1);    filter:brightness(1); background:var(--bg); }
    45%  { transform:scale(1,.004); filter:brightness(8); background:#fff; }
    80%  { transform:scale(.02,.004); filter:brightness(12); background:#fff; opacity:1; }
    100% { transform:scale(0,0); opacity:0; background:#fff; }
  }
  @keyframes kidsIn  { 0%,35% { opacity:0; } 100% { opacity:1; } }
  @keyframes kidsOut { 0% { opacity:1; } 35%,100% { opacity:0; } }
  @keyframes pop { from { opacity:0; transform:translateY(18px) scale(.94); } to { opacity:1; transform:none; } }
  @keyframes slideUp { from { opacity:0; transform:translateY(40px); } to { opacity:1; transform:none; } }

  /* Анимация раздела только transform: opacity ломает размытие стекла */
  .view { display:none; flex:1; flex-direction:column; min-height:0; position:relative; z-index:1; }
  .view.active { display:flex; animation:viewIn .45s var(--ease) backwards; }
  @keyframes viewIn { from { transform:translateY(18px) scale(.985); } to { transform:none; } }

  /* =====================================================================
     Стеклянные поверхности
     ===================================================================== */
  .tabs, .ico, #clock, .hero, .clockw, .tile, .rcard, .app, .chip, .cchip, .srow, .smenu, .bar, .field, .key, .card, .pin {
    background:var(--glass); border:1px solid var(--stroke);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28), inset 0 -1px 0 rgba(255,255,255,.04), 0 12px 32px rgba(0,0,0,.22);
    -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
  }
  /* вложенное в стекло — без повторного размытия */
  .bar .ico, .bar .field, .pcard .chip, .pcard .field, .tabs .tab, .card .x, .key, .card, .smenu-col .smenu.on, #oskPrev {
    -webkit-backdrop-filter:none; backdrop-filter:none; }
  .bar .ico { background:transparent; border-color:transparent; box-shadow:none; }
  .key { box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 4px 10px rgba(0,0,0,.18); }

  /* Фокус маленьких элементов: белая "таблетка" (как в tvOS) */
  .ico:focus, .ico:hover, .tab:focus, .tab:hover, #clock:focus, #clock:hover, .chip:focus, .chip:hover, .cchip:focus, .cchip:hover,
  .smenu:focus, .key:focus, .key:hover, .p-clear:focus, .pin:focus, .pin:hover, .pclose:focus, .pclose:hover {
    background:rgba(255,255,255,.94); color:#0d1020; border-color:#fff;
    box-shadow:0 0 0 4px rgba(255,255,255,.22), 0 14px 34px rgba(0,0,0,.45); transform:scale(var(--fs,1.08)); z-index:3; }
  /* Фокус больших карточек: приподнимаются, светлее стекло и белая кромка */
  .tile:focus, .tile:hover, .rcard:focus, .rcard:hover, .app:focus, .app:hover, .card:focus, .card:hover, .clockw:focus, .clockw:hover {
    background:var(--glass-hi); border-color:rgba(255,255,255,.22);
    box-shadow:0 0 42px color-mix(in srgb, var(--c, var(--accent)) 60%, transparent), 0 24px 52px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.4);
    transform:scale(var(--fs,1.06)); z-index:3; }
  .ico { --fs:1.12; } .tile, .app { --fs:1.05; } .card { --fs:1.03; } .clockw { --fs:1.02; } .key { --fs:1.1; }
  .tab:active, .tile:active, .rcard:active, .app:active, .key:active, .chip:active, .cchip:active, .btn:active, .ico:active { transform:scale(.95) !important; }
  .ico.danger:focus, .ico.danger:hover { background:#ff453a; color:#fff; border-color:#ff453a; box-shadow:0 0 0 4px rgba(255,69,58,.3), 0 14px 34px rgba(0,0,0,.45); }

  /* ===== Верхняя панель ===== */
  .top { display:flex; align-items:center; gap:14px; padding:18px 40px 8px; font-size:20px; flex:none; }
  .top .sp { flex:1; }
  .tabs { display:flex; gap:4px; padding:5px; border-radius:999px; }
  .tab { position:relative; color:var(--muted); cursor:pointer; padding:9px 24px; border-radius:999px; font-weight:500; background:transparent; border:1px solid transparent;
         transition:color .2s, background .25s, transform .25s var(--ease), box-shadow .25s; }
  .tab.on { color:#fff; background:rgba(255,255,255,.2); box-shadow:inset 0 1px 0 rgba(255,255,255,.3); }
  .ico { position:relative; font-size:24px; color:#e9eeff; cursor:pointer; width:50px; height:50px; border-radius:50%;
         display:flex; align-items:center; justify-content:center; transition:background .2s, color .2s, transform .25s var(--ease), box-shadow .25s; }
  .ico.sm { width:44px; height:44px; font-size:22px; }
  #wifi { cursor:default; background:none; border-color:transparent; box-shadow:none; backdrop-filter:none; width:40px; } #wifi:hover { background:none; transform:none; box-shadow:none; color:#e9eeff; } #wifi.off { opacity:.35; }
  #clock { font-size:20px; font-weight:500; cursor:pointer; padding:0 20px; height:50px; display:flex; align-items:center; border-radius:999px; font-variant-numeric:tabular-nums;
           transition:background .2s, transform .2s var(--ease), box-shadow .25s; }
  .badge { position:absolute; top:-3px; right:-4px; min-width:20px; height:20px; border-radius:10px; background:var(--accent);
           color:#fff; font-size:12px; font-weight:600; display:none; align-items:center; justify-content:center; padding:0 5px; box-shadow:0 2px 8px rgba(0,0,0,.4); }
  .badge.on { display:flex; animation:pop .3s var(--ease); }

  /* ===== Главная ===== */
  #homeScroll { flex:1; overflow-y:auto; padding:10px 40px 44px; scroll-behavior:smooth; }
  .stage { display:flex; gap:20px; height:clamp(190px, 28vh, 280px); flex:none; padding:4px; margin:-4px; }

  /* Часы-виджет */
  .clockw { flex:none; width:clamp(310px, 27vw, 450px); border-radius:30px; padding:20px 30px; display:flex; flex-direction:column; justify-content:center; cursor:pointer;
            position:relative; overflow:hidden; transition:transform .3s var(--ease), box-shadow .3s, background .3s; }
  .clockw::before { content:''; position:absolute; inset:0; background:radial-gradient(120% 90% at 0% 0%, rgba(255,255,255,.2), transparent 58%); pointer-events:none; }
  .cw-greet { font-size:15px; font-weight:500; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; margin-bottom:4px; position:relative; }
  .cw-time { font-size:clamp(66px, 10vh, 100px); font-weight:200; line-height:1; letter-spacing:-3px; font-variant-numeric:tabular-nums; position:relative;
             text-shadow:0 6px 30px rgba(0,0,0,.35); white-space:nowrap; }
  .cw-time small { font-size:.3em; font-weight:300; letter-spacing:0; color:var(--muted); margin-left:10px; vertical-align:.9em; }
  .cw-date { font-size:20px; font-weight:500; margin-top:8px; position:relative; }
  .cw-bar { height:4px; border-radius:2px; background:rgba(255,255,255,.15); margin-top:16px; overflow:hidden; position:relative; }
  .cw-bar i { display:block; height:100%; width:0; background:linear-gradient(90deg, rgba(255,255,255,.45), #fff); border-radius:2px; transition:width 1s linear; }
  .cw-sub { font-size:13px; color:var(--muted); margin-top:7px; position:relative; }

  /* Баннер */
  .hero { position:relative; flex:1; min-width:0; border-radius:30px; overflow:hidden; container-type:inline-size; }
  .slide { position:absolute; inset:0; display:flex; flex-direction:row; align-items:center; gap:clamp(10px, 4cqw, 28px); padding:0 clamp(20px, 7cqw, 48px);
           opacity:0; transform:scale(1.04); transition:opacity .8s ease, transform 1.4s ease; pointer-events:none; }
  .slide.on { opacity:1; transform:none; pointer-events:auto; }
  .slide .txt { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; }
  .slide h1 { margin:0 0 6px; font-size:38px; font-weight:700; letter-spacing:-.5px; line-height:1.1; transform:translateX(-24px); opacity:0; transition:transform .7s var(--ease) .1s, opacity .7s .1s; }
  .slide p  { margin:0 0 18px; font-size:17px; color:rgba(255,255,255,.82); transform:translateX(-24px); opacity:0; transition:transform .7s var(--ease) .2s, opacity .7s .2s; }
  .slide.on h1, .slide.on p { transform:none; opacity:1; }
  .slide .bg-ico { flex:none; font-size:clamp(52px, 20cqw, 130px); opacity:.7; display:flex; transform:rotate(-8deg); animation:float 6s ease-in-out infinite; }   /* иконка в потоке рядом с текстом, а не поверх него */
  @keyframes float { 50% { transform:translateY(-6px) rotate(-3deg); } }
  @container (max-width:340px) { .slide .bg-ico { display:none; } }
  .slide .bg-ico img { width:1em; height:1em; filter:drop-shadow(0 10px 30px rgba(0,0,0,.4)); }
  .btn { align-self:flex-start; display:flex; align-items:center; gap:8px; font-size:17px; font-weight:600; background:rgba(255,255,255,.94); color:#0d1020;
         padding:10px 26px; border-radius:30px; cursor:pointer; transition:transform .2s var(--ease), box-shadow .2s; box-shadow:0 8px 22px rgba(0,0,0,.3); }
  .btn:hover, .btn:focus { transform:scale(1.08); box-shadow:0 0 0 4px rgba(255,255,255,.35), 0 12px 30px rgba(0,0,0,.4); }
  .dots { position:absolute; right:26px; bottom:18px; display:flex; gap:8px; z-index:2; }
  .dots i { width:8px; height:8px; border-radius:4px; background:rgba(255,255,255,.4); transition:width .35s var(--ease), background .3s; }
  .dots i.on { width:26px; background:#fff; }

  .sec { font-size:27px; font-weight:700; letter-spacing:-.3px; margin:30px 0 2px; }
  .sub { font-size:16px; color:var(--muted); margin:14px 0 0; font-weight:500; }
  .rail { display:flex; gap:16px; overflow-x:auto; padding:14px 12px 24px; margin:0 -12px; scroll-behavior:smooth; scrollbar-width:none; }
  .rail.apps { display:grid; grid-auto-flow:column; grid-template-rows:repeat(2, 98px); grid-auto-columns:238px; gap:16px; }

  /* Плитки приложений */
  .ic { width:54px; height:54px; flex:none; display:flex; align-items:center; justify-content:center; }
  .ic img { width:46px; height:46px; border-radius:12px; object-fit:contain; filter:drop-shadow(0 4px 10px rgba(0,0,0,.45)); }
  /* Chromium: чёткий логотип, рисуется кодом (не размытая иконка) */
  .cr { display:inline-block; width:1em; height:1em; border-radius:50%; position:relative; flex:none;
        background:conic-gradient(from -60deg, #ea4335 0 120deg, #fbbc04 120deg 240deg, #34a853 240deg 360deg);
        box-shadow:0 2px 6px rgba(0,0,0,.35); }
  .cr::before { content:''; position:absolute; inset:19%; border-radius:50%; background:#fff; }
  .cr::after  { content:''; position:absolute; inset:27%; border-radius:50%; background:radial-gradient(circle at 35% 30%, #7fb2ff, #1a73e8 70%); }
  .ic.sv { color:#fff; font-size:34px; }
  .tile { display:flex; align-items:center; justify-content:flex-start; gap:16px; padding:0 18px; border-radius:24px; cursor:pointer;
          font-size:19px; font-weight:600; animation:pop .5s var(--ease) backwards; animation-delay:calc(var(--i,0) * 40ms);
          background:linear-gradient(135deg, color-mix(in srgb, var(--c,#666) 62%, transparent), rgba(255,255,255,.06));
          transition:transform .28s var(--ease), box-shadow .28s, background .28s; }
  .tile > span:last-child { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tile:focus, .tile:hover { background:linear-gradient(135deg, color-mix(in srgb, var(--c,#888) 88%, transparent), rgba(255,255,255,.2)); }
  .tile:focus, .tile:hover { box-shadow:0 0 46px color-mix(in srgb, var(--c,#789) 75%, transparent), 0 24px 52px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.35); border-color:rgba(255,255,255,.2); }
  .tile.add { background:var(--glass); border-style:dashed; border-color:rgba(255,255,255,.3); }
  .tile.add:focus, .tile.add:hover { background:var(--glass-hi); }

  .rcard { flex:none; width:268px; height:150px; border-radius:22px; background-color:rgba(255,255,255,.07); background-position:center; background-size:cover; background-repeat:no-repeat; position:relative;
           overflow:hidden; cursor:pointer; animation:pop .5s var(--ease) backwards; animation-delay:calc(var(--i,0) * 40ms);
           transition:transform .28s var(--ease), box-shadow .28s; }
  .rcard:focus, .rcard:hover { --fs:1.06; }
  .rcard .ph { position:absolute; inset:0 0 50px 0; display:flex; align-items:center; justify-content:center; }
  .rcard .ph img { width:56px; height:56px; border-radius:14px; filter:drop-shadow(0 4px 10px rgba(0,0,0,.45)); }
  .rcard .tx { position:absolute; left:0; right:0; bottom:0; padding:10px 16px; background:linear-gradient(transparent, rgba(0,0,0,.75) 70%); }
  .rcard b { display:block; font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rcard small { color:rgba(255,255,255,.72); font-size:12.5px; }
  .rcard .prog { position:absolute; left:0; bottom:0; height:4px; background:#fff; border-radius:0 2px 2px 0; }
  .empty-rail { color:var(--muted); font-size:15px; padding:18px 6px; }

  /* ===== Каталог ===== */
  #catalog { padding:0 40px; }
  .head { display:flex; align-items:center; gap:16px; padding:16px 0 6px; font-size:28px; font-weight:700; letter-spacing:-.3px; flex:none; }
  .head .sp { flex:1; }
  .head .count { font-size:15px; font-weight:500; color:var(--muted); letter-spacing:0; }
  #cSearch { width:min(380px, 34vw); font-size:18px; font-weight:400; padding:11px 22px; border-radius:999px; }
  .cchips { display:flex; gap:10px; overflow-x:auto; padding:12px 6px 14px; margin:0 -6px; flex:none; scrollbar-width:none; scroll-behavior:smooth; }
  .cchip { flex:none; padding:9px 20px; border-radius:999px; font-size:16px; font-weight:500; cursor:pointer; color:#e9eeff;
           transition:background .2s, color .2s, transform .2s var(--ease), box-shadow .2s; }
  .cchip.on { background:color-mix(in srgb, var(--accent) 78%, transparent); border-color:rgba(255,255,255,.4); color:#fff; }
  .cchip.on:focus, .cchip.on:hover { background:#fff; color:#0d1020; }
  #catalogBody { flex:1; overflow-y:auto; padding:0 6px 40px; margin:0 -6px; scroll-behavior:smooth; }
  .cat-title { margin:24px 0 14px; color:var(--muted); font-size:14px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; display:flex; gap:10px; align-items:center; }
  .cat-title em { font-style:normal; font-size:12px; padding:2px 9px; border-radius:10px; background:rgba(255,255,255,.12); letter-spacing:0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px,1fr)); gap:16px; padding:6px; margin:-6px; }
  .app { display:flex; gap:16px; align-items:center; padding:14px 18px; border-radius:22px; cursor:pointer; position:relative;
         animation:pop .45s var(--ease) backwards; animation-delay:calc(var(--i,0) * 22ms); transition:transform .28s var(--ease), box-shadow .28s, background .28s; }
  .app .tx { min-width:0; flex:1; }
  .app b { display:block; font-size:18px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .app small { display:block; color:var(--muted); font-size:14px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .app .dl { font-size:24px; color:#fff; opacity:.8; display:flex; flex:none; }
  .app .dl .pct { font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; min-width:42px; text-align:right; }
  .app .pgb { position:absolute; left:20px; right:20px; bottom:7px; height:3px; border-radius:2px; background:rgba(255,255,255,.16); overflow:hidden; display:none; }
  .app .pgb i { display:block; height:100%; width:var(--p, 0%); background:#fff; border-radius:2px; transition:width .25s linear; }
  .app.busy .pgb { display:block; } .app.busy .pgb.ind i { width:35%; animation:indet 1.1s ease-in-out infinite; }
  @keyframes indet { from { margin-left:-35%; } to { margin-left:100%; } }
  .pin { width:42px; height:42px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-size:20px; cursor:pointer; transition:background .2s, transform .2s var(--ease), color .2s; }
  .pin.done { color:#4ade80; }
  .nores { color:var(--muted); font-size:19px; text-align:center; padding:70px 0; }

  /* ===== Браузер ===== */
  .bar { display:flex; align-items:center; gap:6px; padding:7px 12px; margin:12px 40px 12px; border-radius:999px; flex:none; }
  .bar .ico { width:42px; height:42px; font-size:21px; }
  input.field { flex:1; font-size:17px; padding:10px 20px; border-radius:999px; color:var(--text); outline:none; font-family:inherit;
                transition:border-color .2s, box-shadow .2s, background .2s; }
  input.field::placeholder { color:var(--muted); }
  input.field:focus { background:rgba(255,255,255,.16); border-color:rgba(255,255,255,.75); box-shadow:0 0 0 4px rgba(255,255,255,.18); }
  .bar .field { background:rgba(255,255,255,.1); box-shadow:none; }
  #webviews { position:relative; flex:1; background:transparent; }
  webview { display:none; position:absolute; inset:0; width:100%; height:100%; background:#fff; }
  webview.on { display:inline-flex; }
  #bstart { position:absolute; inset:0; background:transparent; display:flex; flex-direction:column; align-items:center; padding:5vh 40px 0; overflow-y:auto; z-index:2; }
  #bstart.hide { display:none; }
  #bstart h2 { display:flex; align-items:center; gap:16px; font-weight:300; font-size:42px; margin:0 0 24px; letter-spacing:-.5px; animation:slideUp .5s var(--ease) backwards; }
  #bstart h2 img { width:52px; height:52px; border-radius:14px; }

  /* ===== Настройки ===== */
  #settings { padding:0 40px 24px; }
  .sbody { flex:1; display:flex; gap:30px; min-height:0; padding-top:10px; }
  .smenu-col { width:300px; display:flex; flex-direction:column; gap:8px; flex:none; }
  .smenu { display:flex; align-items:center; gap:14px; padding:15px 20px; border-radius:20px; font-size:19px; font-weight:500; color:#dfe6fb; cursor:pointer;
           transition:background .2s, transform .25s var(--ease), color .2s; animation:pop .45s var(--ease) backwards; animation-delay:calc(var(--i,0) * 50ms); }
  .smenu .i { font-size:24px; }
  .smenu.on { background:rgba(255,255,255,.2); color:#fff; }
  .smenu:focus { --fs:1; transform:translateX(8px); }
  .spane { flex:1; overflow-y:auto; padding:0 10px 20px 4px; margin-right:-6px; }
  .spane h3 { margin:2px 0 18px; font-weight:700; font-size:30px; letter-spacing:-.4px; animation:slideUp .4s var(--ease) backwards; }
  .srow { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:15px 22px; margin-bottom:10px; border-radius:20px;
          font-size:18px; animation:pop .4s var(--ease) backwards; animation-delay:calc(var(--i,0) * 40ms); }
  .srow .v { color:var(--muted); text-align:right; }
  .srow .ctl { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .chip { padding:9px 20px; border-radius:999px; cursor:pointer; font-size:16px; font-weight:500; transition:background .2s, color .2s, transform .2s var(--ease), box-shadow .2s; }
  .chip.on { background:color-mix(in srgb, var(--accent) 80%, transparent); border-color:rgba(255,255,255,.45); color:#fff; }
  .chip.on:focus, .chip.on:hover { background:#fff; color:#0d1020; }
  .sw { display:inline-block; width:16px; height:16px; border-radius:50%; vertical-align:-3px; margin-right:8px; box-shadow:0 0 0 2px rgba(255,255,255,.55); }

  /* ===== Боковая панель вкладок ===== */
  #handle { position:fixed; left:0; top:50%; transform:translateY(-50%); width:22px; height:150px; z-index:30; background:var(--glass);
            border:1px solid var(--stroke); border-left:0; -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
            border-radius:0 16px 16px 0; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#fff; font-size:16px;
            transition:width .25s var(--ease), background .2s; }
  #handle:hover, #handle:focus { width:36px; background:rgba(255,255,255,.3); }
  #handle .badge { top:6px; right:auto; left:50%; transform:translateX(-50%); }
  #backdrop { position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:opacity .3s; }
  #backdrop.on { opacity:1; pointer-events:auto; }
  #panel { position:fixed; left:0; top:0; bottom:0; width:360px; z-index:50; background:rgba(22,26,40,.5); transform:translateX(-102%);
           -webkit-backdrop-filter:blur(44px) saturate(180%); backdrop-filter:blur(44px) saturate(180%); border-right:1px solid var(--stroke);
           transition:transform .38s var(--ease); display:flex; flex-direction:column; box-shadow:12px 0 50px rgba(0,0,0,.5), inset -1px 0 0 rgba(255,255,255,.08); }
  #panel.open { transform:none; }
  .p-head { display:flex; align-items:center; justify-content:space-between; padding:22px 22px 12px; font-size:24px; font-weight:700; }
  .p-clear { font-size:14px; font-weight:500; color:#fff; cursor:pointer; padding:8px 16px; border-radius:999px; background:rgba(255,255,255,.14); transition:background .2s, transform .2s var(--ease); }
  #list { flex:1; overflow-y:auto; padding:8px 18px 18px; display:flex; flex-direction:column; gap:14px; }
  .empty { color:var(--muted); text-align:center; margin-top:40px; }
  .card { border-radius:22px; overflow:hidden; cursor:pointer; flex:none; animation:cardIn .35s var(--ease) backwards; transition:transform .25s var(--ease), box-shadow .25s; }
  .card.cur { border-color:rgba(255,255,255,.6); }
  @keyframes cardIn { from { opacity:0; transform:translateX(-30px); } to { opacity:1; transform:none; } }
  .thumb { height:150px; background:rgba(255,255,255,.07) center/cover no-repeat; display:flex; align-items:center; justify-content:center; }
  .thumb img { width:56px; height:56px; border-radius:14px; filter:drop-shadow(0 4px 10px rgba(0,0,0,.45)); }
  .meta { display:flex; align-items:center; gap:10px; padding:11px 14px; }
  .meta > img { width:26px; height:26px; flex:none; border-radius:7px; }
  .meta .t { flex:1; min-width:0; } .meta b { display:block; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meta small { color:var(--muted); font-size:12px; }
  .x { font-size:20px; display:flex; padding:7px; border-radius:50%; color:#e9eeff; transition:background .2s, transform .2s; }
  .x:hover, .x:focus { background:#ff453a; color:#fff; transform:rotate(90deg); }

  /* ===== Всплывающие окна ===== */
  .pop { position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; background:rgba(5,7,14,.5);
         -webkit-backdrop-filter:blur(18px) saturate(140%); backdrop-filter:blur(18px) saturate(140%); opacity:0; pointer-events:none; transition:opacity .28s; }
  .pop.on { opacity:1; pointer-events:auto; }
  .pcard { position:relative; width:580px; max-width:92vw; padding:38px 44px; border-radius:36px;
           background:linear-gradient(145deg, rgba(255,255,255,.2), rgba(255,255,255,.07)); border:1px solid rgba(255,255,255,.28);
           box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.45);
           transform:scale(.9) translateY(20px); transition:transform .4s var(--ease); }
  .pop.on .pcard { transform:none; }
  .pclose { position:absolute; top:16px; right:16px; font-size:22px; display:flex; padding:8px; border-radius:50%; cursor:pointer; background:rgba(255,255,255,.14); transition:background .2s, transform .2s var(--ease); }
  .cp-time { font-size:104px; font-weight:200; line-height:1; letter-spacing:-4px; font-variant-numeric:tabular-nums; }
  .cp-time span { font-size:46px; color:var(--muted); letter-spacing:0; }
  .cp-date { font-size:24px; font-weight:500; margin:10px 0 20px; }
  .cp-chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px; }
  .cp-chips i { font-style:normal; font-size:14px; padding:7px 14px; border-radius:999px; background:rgba(255,255,255,.14); color:#e9eeff; }
  .cp-fact { border-top:1px solid rgba(255,255,255,.2); padding-top:18px; }
  .cp-label { font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  #cpFact { font-size:18px; line-height:1.5; min-height:52px; } #cpFact b { font-size:22px; }
  .pcard h3 { margin:0 0 20px; font-weight:700; font-size:27px; letter-spacing:-.3px; }
  .pcard .field { width:100%; display:block; margin-bottom:20px; background:rgba(255,255,255,.12); box-shadow:none; }
  .prow { display:flex; gap:10px; justify-content:flex-end; }

  /* ===== Спящий режим ===== */
  #sleep { position:fixed; inset:0; z-index:200; background:rgba(0,0,0,var(--dim)); opacity:0; pointer-events:none; transition:opacity 1.4s ease; cursor:none;
           -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); display:flex; align-items:center; justify-content:center; }
  #sleep.on { opacity:1; pointer-events:auto; }
  .sl-wrap { text-align:center; opacity:.0; animation:slDrift 120s ease-in-out infinite alternate; }
  #sleep.on .sl-wrap { opacity:1; }
  .sl-time { font-size:clamp(90px, 18vh, 190px); font-weight:200; letter-spacing:-5px; line-height:1; color:rgba(255,255,255,.5); font-variant-numeric:tabular-nums; }
  .sl-date { font-size:22px; color:rgba(255,255,255,.32); margin-top:8px; font-weight:500; }
  .sl-hint { position:absolute; bottom:6vh; left:0; right:0; text-align:center; font-size:15px; letter-spacing:.08em; color:rgba(255,255,255,.28); animation:slHint 6s ease forwards; }
  @keyframes slHint { 0%,70% { opacity:1; } 100% { opacity:0; } }
  @keyframes slDrift { from { transform:translate(-4vw,-3vh); } to { transform:translate(4vw,3vh); } }

  /* ===== Экранная клавиатура ===== */
  #osk { position:fixed; left:0; right:0; bottom:0; z-index:80; background:rgba(20,24,38,.55); border-top:1px solid rgba(255,255,255,.2); padding:14px 3vw 18px;
         -webkit-backdrop-filter:blur(44px) saturate(180%); backdrop-filter:blur(44px) saturate(180%);
         transform:translateY(105%); transition:transform .4s var(--ease); box-shadow:0 -14px 50px rgba(0,0,0,.5); }
  #osk.open { transform:none; }
  #oskPrev { height:46px; margin:0 auto 12px; max-width:900px; padding:0 22px; border-radius:23px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18); display:flex; align-items:center; font-size:21px; overflow:hidden; white-space:nowrap; }
  #oskPrev::after { content:''; width:2px; height:26px; background:#fff; margin-left:2px; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .krow { display:flex; justify-content:center; gap:9px; margin-bottom:9px; }
  .key { flex:1 1 0; max-width:84px; height:clamp(44px, 6vh, 62px); display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:500; border-radius:14px;
         cursor:pointer; user-select:none; border-color:rgba(255,255,255,.12); background:rgba(255,255,255,.13); transition:background .15s, color .15s, transform .2s var(--ease), box-shadow .2s; }
  .key.wide { flex:1.6 1 0; max-width:140px; } .key.space { flex:6 1 0; max-width:480px; } .key.act { background:rgba(255,255,255,.07); font-size:17px; }
  .key.go { background:var(--accent); border-color:transparent; }
  .key.on { background:var(--accent); color:#fff; }

  /* ===== Обои-фото и стеклянные часы (стиль «гора») ===== */
  .wall::after { background:linear-gradient(180deg, rgba(0,0,0,.34) 0%, transparent 26%, rgba(3,7,18,.18) 52%, rgba(3,7,18,.78) 100%),
                            linear-gradient(rgba(0,0,0,var(--wdim,.2)), rgba(0,0,0,var(--wdim,.2))); }
  body.photo .wall i { display:none; }
  .wp { position:absolute; inset:-3%; background-size:cover; background-position:center 40%; opacity:0; transition:opacity 2.4s ease; will-change:opacity, transform; }
  .wp.on { opacity:1; }
  .wp.kb { animation:kenb 50s ease-in-out infinite alternate; }
  @keyframes kenb { from { transform:scale(1); } to { transform:scale(1.09) translate3d(-1.5%,-1%,0); } }

  .stage { align-items:stretch; gap:30px; height:clamp(210px, 35vh, 380px); }
  .hero { flex:none; width:clamp(300px, 28vw, 480px); align-self:center; height:clamp(170px, 24vh, 260px); }
  .slide h1 { font-size:clamp(20px, min(3vh, 6.4cqw), 34px); } .slide p { font-size:clamp(13px, 3.8cqw, 16px); margin-bottom:14px; }
  .clockw, .clockw:focus, .clockw:hover { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; cursor:pointer; position:relative; padding:0 10px; width:auto; border-radius:36px;
            background:none; border:0; box-shadow:none; -webkit-backdrop-filter:none; backdrop-filter:none; transform:none; }
  .clockw::before { display:none; }
  .cw-date { font:700 clamp(20px, 3.2vh, 34px)/1.1 "SF Pro Rounded","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif; color:rgba(255,255,255,.92); text-shadow:0 2px 20px rgba(0,0,0,.4); margin:0 0 .6vh 8px; }
  .cw-time { font-family:"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif; font-size:clamp(110px, 27vh, 300px); font-weight:800; line-height:.9; letter-spacing:-.045em; font-variant-numeric:tabular-nums; white-space:nowrap; position:relative; width:max-content; max-width:100%; text-shadow:none;
             background:linear-gradient(180deg, rgba(255,255,255,.95) 6%, rgba(255,255,255,.46) 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
             -webkit-text-stroke:1px rgba(255,255,255,.3); filter:drop-shadow(0 12px 44px rgba(8,16,40,.4)); transition:filter .4s; }
  .cw-time small { display:none; }
  .clockw:focus .cw-time, .clockw:hover .cw-time { filter:drop-shadow(0 0 36px rgba(255,255,255,.55)) drop-shadow(0 12px 44px rgba(8,16,40,.4)); }
  .cw-cap { display:flex; align-items:center; gap:8px; margin:1.2vh 0 0 10px; font-size:16px; font-weight:600; color:rgba(255,255,255,.88); text-shadow:0 1px 12px rgba(0,0,0,.6); min-height:22px; opacity:0; transition:opacity 1.2s; }
  .cw-cap.on { opacity:1; }
  body[data-clock="classic"] .cw-time { font-weight:200; background:none; color:#fff; -webkit-text-stroke:0; filter:drop-shadow(0 6px 30px rgba(0,0,0,.4)); }
  body[data-clock="classic"] .cw-time small { display:inline; font-size:.28em; margin-left:10px; vertical-align:.9em; color:var(--muted); }
  body[data-clock="off"] .clockw { display:none; }
  body[data-clock="off"] .hero { align-self:flex-start; width:min(100%, 900px); flex:1; }

  /* Выбор фото в настройках */
  .wgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:16px; padding:8px 6px 14px; margin:0 -6px; }
  .wth { position:relative; aspect-ratio:16/9; border-radius:22px; background:#1b2036 center/cover no-repeat; overflow:hidden; cursor:pointer; animation:pop .45s var(--ease) backwards; animation-delay:calc(var(--i,0) * 30ms);
         box-shadow:0 10px 26px rgba(0,0,0,.35); transition:transform .3s var(--ease), box-shadow .3s; }
  .wth span { position:absolute; left:0; right:0; bottom:0; padding:26px 14px 10px; background:linear-gradient(transparent, rgba(0,0,0,.78)); display:flex; flex-direction:column; }
  .wth b { font-size:15px; font-weight:600; } .wth small { font-size:12.5px; color:rgba(255,255,255,.75); }
  .wth .chk { position:absolute; top:10px; right:10px; width:30px; height:30px; border-radius:50%; background:var(--accent); display:none; align-items:center; justify-content:center; font-size:18px; }
  .wth.on .chk { display:flex; }
  .wth.on { box-shadow:inset 0 0 0 3px var(--accent), 0 10px 26px rgba(0,0,0,.35); }
  .wth:focus, .wth:hover { transform:scale(1.05); z-index:3; box-shadow:0 0 40px color-mix(in srgb, var(--accent) 50%, transparent), 0 22px 46px rgba(0,0,0,.5); }
  .wth.on:focus { box-shadow:inset 0 0 0 3px var(--accent), 0 0 40px color-mix(in srgb, var(--accent) 50%, transparent), 0 22px 46px rgba(0,0,0,.5); }
  .sgrp { margin:24px 0 8px 6px; font-size:15px; font-weight:600; color:var(--muted); }

  /* ===== Плитки-превью 16:9, как на Android TV ===== */
  .rail.apps { grid-template-rows:repeat(2, clamp(118px, 19vh, 150px)); grid-auto-columns:clamp(218px, 19vw, 268px); gap:18px; }
  .tile { position:relative; overflow:hidden; flex-direction:column; justify-content:center; align-items:center; gap:8px; padding:0 12px; border-radius:22px; text-align:center; font-size:17px; }
  .tile > * { position:relative; z-index:2; }
  .tile::before { content:''; position:absolute; inset:0; z-index:0; background:var(--bn) center/cover no-repeat; opacity:0; transition:opacity .7s, transform .8s var(--ease); }
  .tile::after  { content:''; position:absolute; inset:0; z-index:1; pointer-events:none; background:linear-gradient(180deg, rgba(0,0,0,.05) 35%, rgba(0,0,0,.78)); opacity:0; transition:opacity .5s; }
  .tile.has-bn::before, .tile.has-bn::after { opacity:1; }
  .tile.has-bn:focus::before, .tile.has-bn:hover::before { transform:scale(1.06); }
  .tile.has-bn { flex-direction:row; justify-content:flex-start; align-items:flex-end; gap:10px; padding:0 14px 12px; text-align:left; font-size:16px; }
  .tile.has-bn .ic { width:34px; height:34px; } .tile.has-bn .ic img { width:30px; height:30px; border-radius:8px; } .tile.has-bn .cr { font-size:30px !important; }
  .tile.has-bn > span:last-child { text-shadow:0 2px 10px rgba(0,0,0,.7); }
  .tile:not(.has-bn) .ic { width:58px; height:58px; } .tile:not(.has-bn) .ic img { width:52px; height:52px; border-radius:14px; } .tile:not(.has-bn) .cr { font-size:50px !important; }
  .tile.add { gap:6px; }

  /* =====================================================================
     v0.6 — «прошивка»: анимации включения / выключения / запуска, настройки в стиле ТВ
     ===================================================================== */
  @property --r { syntax:'<percentage>'; inherits:false; initial-value:-25%; }
  #app.tv-on, #app.tv-on > *, #app.tv-off, #app.tv-off > * { animation:none; }
  #veil { position:fixed; inset:0; z-index:300; background:#000; pointer-events:none; display:grid; place-items:center;
          -webkit-mask-image:radial-gradient(circle at 50% 50%, transparent var(--r), #000 calc(var(--r) + 28%));
          mask-image:radial-gradient(circle at 50% 50%, transparent var(--r), #000 calc(var(--r) + 28%)); }
  #veil.done { display:none; }
  body.noanim #veil { display:none !important; }
  #veil.boot { animation:veilOpen 1.9s cubic-bezier(.5,0,.15,1) .95s both; }
  #veil.shut { animation:veilClose 1s cubic-bezier(.65,0,.3,1) .25s both; }
  @keyframes veilOpen  { from { --r:-28%; } to { --r:128%; } }
  @keyframes veilClose { from { --r:128%; } to { --r:-28%; } }
  .vlogo { width:140px; height:140px; border-radius:32px; opacity:0; filter:drop-shadow(0 24px 70px rgba(120,100,255,.6)); }
  .vring { position:absolute; width:140px; height:140px; border-radius:50%; border:2px solid rgba(255,255,255,.55); opacity:0; }
  #veil.boot .vlogo { animation:vlogoIn 1.1s var(--ease) both; }
  #veil.boot .vring { animation:vring 1.6s ease-out .15s both; }
  #veil.shut .vlogo { display:none; }
  @keyframes vlogoIn { 0% { opacity:0; transform:scale(.72); filter:blur(14px) drop-shadow(0 24px 70px rgba(120,100,255,.6)); } 100% { opacity:1; transform:none; } }
  @keyframes vring { 0% { opacity:.8; transform:scale(.8); } 100% { opacity:0; transform:scale(3.4); } }
  .vdot { position:absolute; width:14px; height:14px; border-radius:50%; background:#fff; opacity:0;
          box-shadow:0 0 26px 10px rgba(255,255,255,.75), 0 0 110px 40px rgba(130,160,255,.4); }
  #veil.shut .vdot { animation:vdot 1.25s ease both; }
  @keyframes vdot { 0%,62% { opacity:0; transform:scale(.2); } 80% { opacity:1; transform:scale(1.2); } 100% { opacity:0; transform:scale(.05); } }
  #app.tv-on .view.active { animation:uiBoot 2.1s var(--ease) 1.15s backwards; }
  #app.tv-on .wall { animation:wallBoot 2.8s ease 1.1s backwards; }
  #app.tv-on .tile, #app.tv-on .rcard { animation-delay:calc(1.45s + var(--i,0) * 45ms); }
  @keyframes uiBoot { from { transform:scale(1.1); } to { transform:none; } }
  @keyframes wallBoot { from { transform:scale(1.18); filter:brightness(.4); } to { transform:none; filter:none; } }
  #app.tv-off .view.active { animation:uiOff .95s cubic-bezier(.6,0,.9,.5) forwards; }
  @keyframes uiOff { to { transform:scale(.9); } }

  /* переходы между разделами: вглубь — справа, назад — слева */
  .view.active { animation:viewFwd .6s var(--ease) backwards; }
  body[data-dir="back"] .view.active { animation-name:viewBack; }
  @keyframes viewFwd  { from { transform:translateX(6vw) scale(.965); } to { transform:none; } }
  @keyframes viewBack { from { transform:translateX(-4vw) scale(1.035); } to { transform:none; } }

  /* запуск и закрытие приложений */
  #morph { position:fixed; z-index:150; display:none; overflow:hidden; pointer-events:none; align-items:center; justify-content:center;
           box-shadow:0 30px 90px rgba(0,0,0,.55); will-change:left, top, width, height, clip-path, opacity; }
  #morph .mi { display:flex; animation:miz .7s var(--ease) both; }
  @keyframes miz { from { transform:scale(.9); } to { transform:scale(1.8); } }
  #morph .ic { width:64px; height:64px; display:flex; align-items:center; justify-content:center; }
  #morph .ic img { width:56px; height:56px; border-radius:14px; filter:drop-shadow(0 6px 18px rgba(0,0,0,.45)); }
  #morph .cr { font-size:56px !important; }
  .pop .pcard { transition:transform .55s cubic-bezier(.34,1.4,.4,1); transform:scale(.86) translateY(28px); }

  #toast { position:fixed; left:50%; bottom:6vh; z-index:250; transform:translate(-50%, 30px); padding:14px 28px; border-radius:999px; font-size:18px; font-weight:600;
           background:rgba(20,24,40,.66); border:1px solid rgba(255,255,255,.22); -webkit-backdrop-filter:blur(30px) saturate(170%); backdrop-filter:blur(30px) saturate(170%);
           box-shadow:0 18px 50px rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:opacity .35s, transform .5s var(--ease); max-width:80vw; text-align:center; }

  async function wifiAction(n, reload) {
    const api = window.api;
    const connect = async pass => {
      toast(`Подключение к «${n.ssid}»…`);
      const r = await api.wifiConnect({ ssid:n.ssid, pass, open:n.open, wpa3:n.wpa3 });
      toast(r.ok ? `Подключено к «${n.ssid}»` : r.err === 'short' ? 'Пароль должен быть от 8 до 63 символов' : 'Не удалось подключиться. Проверьте пароль');
      net(); reload();
    };
    const forget = async () => { await api.wifiForget(n.ssid); toast(`Сеть «${n.ssid}» забыта`); reload(); };
    if (n.connected) return dialog({ title:n.ssid, msg:'Вы подключены к этой сети', buttons:[{ t:'Закрыть', primary:true }, { t:'Отключиться', fn:async () => { await api.wifiDisconnect(); net(); reload(); } }, { t:'Забыть сеть', danger:true, fn:forget }] });
    if (n.saved) return dialog({ title:n.ssid, buttons:[{ t:'Подключиться', primary:true, fn:() => connect() }, { t:'Забыть сеть', danger:true, fn:forget }, { t:'Отмена' }] });
    if (n.open) return dialog({ title:n.ssid, msg:'Сеть без пароля: данные могут быть не защищены.', buttons:[{ t:'Подключиться', primary:true, fn:() => connect('') }, { t:'Отмена' }] });
    dialog({ title:`Пароль для «${n.ssid}»`, input:{ secret:true, ph:'Пароль Wi‑Fi' }, buttons:[{ t:'Подключиться', primary:true, fn:v => { if (v) connect(v); } }, { t:'Отмена' }] });
  }

  function powerOff() {
    if (offing) return; offing = true; sleeping = false; $('#sleep').classList.remove('on');
    $('#veil').className = 'shut'; $('#app').classList.add('tv-off');

  /* ---------- Спящий режим: экран притухает, любая кнопка возвращает ---------- */
  const sleepEl = $('#sleep');
  function sleepOn() {
    if (sleeping || offing) return;
    sleepFocus = document.activeElement; closeOSK(false);
    sleepEl.classList.toggle('noclock', !S.sleepClock);
    sleeping = true; sleepAt = Date.now(); tick();
    sleepEl.classList.add('on'); sleepEl.focus();
    if (window.api) window.api.sleepState(true);
  }
  function wake() {
    if (!sleeping) return;
    sleeping = false; sleepEl.classList.remove('on');
    if (window.api) window.api.sleepState(false);
    setTimeout(() => { try { if (sleepFocus && document.contains(sleepFocus) && visible(sleepFocus)) sleepFocus.focus(); else focusDefault($('.view.active').id); } catch {} }, 60);
  }
  // Перехватываем любой ввод в фазе capture: первое нажатие только будит, действия не выполняет
  ['keydown', 'mousedown', 'click', 'wheel', 'touchstart', 'contextmenu'].forEach(t => window.addEventListener(t, e => {
    if (!sleeping) return;
    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
    if (Date.now() - sleepAt > 450) wake();                 // защита от залипшего Enter, которым включили сон
  }, true));
  let mx = 0, my = 0;
  window.addEventListener('mousemove', e => {
    if (!sleeping) { mx = e.clientX; my = e.clientY; return; }
    if (Date.now() - sleepAt > 800 && Math.hypot(e.clientX - mx, e.clientY - my) > 12) wake();
    else if (Date.now() - sleepAt <= 800) { mx = e.clientX; my = e.clientY; }
  }, true);
  if (window.api) window.api.onWake(wake);

  }
  function spatial(dir) {
    const els = scopeEls(), a = document.activeElement;

    let best = null, bs = 1e9;

      const horiz = dir === 'ArrowLeft' || dir === 'ArrowRight';
      const along = dir === 'ArrowRight' ? dx : dir === 'ArrowLeft' ? -dx : dir === 'ArrowDown' ? dy : -dy;
      const across = horiz ? Math.abs(dy) : Math.abs(dx);
      if (along <= 4) return;
      const sc = along + across * (horiz ? 3 : 2);
      if (sc < bs) { bs = sc; best = el; }
    });

  }
  function goBackUI() {
    const a = document.activeElement;
    if (tilePop.classList.contains('on')) closeTileMenu();
    else if (dlg.classList.contains('on')) { if (osk.open) closeOSK(true); else closeDialog(); }
    else if (cp.classList.contains('on')) closeClock();

  let lp = null;                                           // долгое нажатие OK на плитке открывает меню
  addEventListener('keyup', e => {
    if (e.key === 'Enter' && lp) { const x = lp; lp = null; if (!x.done && document.activeElement === x.el) x.el.click(); }
  });
  addEventListener('keydown', e => {

  /* ---------- Обои: фото из интернета (кэшируются на диск), альбом, ежедневные рекомендации ---------- */
  const WALLS = [

    { id:'ridge',    f:'photo-1486870591958-9b9d0d1dda99', k:'mountains', t:'Горные хребты', p:'Горы' },
    { id:'meadow',   f:'photo-1472396961693-142e6e269027', k:'mountains', t:'Луг у подножия гор', p:'Горная долина' },

    { id:'lake',     f:'photo-1501785888041-af3ef285b470', k:'nature', t:'Горное озеро', p:'Скалистые горы' },
    { id:'yosemite', f:'photo-1506744038136-46273834b3fb', k:'nature', t:'Долина Йосемити', p:'Калифорния, США' },
    { id:'mist',     f:'photo-1470071459604-3b5ec3a7fe05', k:'nature', t:'Туманный лес', p:'Утренний лес' },
    { id:'waterfall', f:'photo-1433086966358-54859d0ed716', k:'nature', t:'Водопад', p:'Дикая природа' },
    { id:'hills',    f:'photo-1472214103451-9374bd1c798e', k:'nature', t:'Зелёные холмы', p:'Закат' },
    { id:'beach',    f:'photo-1507525428034-b723cf961d3e', k:'ocean', t:'Тропический пляж', p:'Океан' },
    { id:'ocean',    f:'photo-1505118380757-91f5f5632de0', k:'ocean', t:'Океан на рассвете', p:'Открытое море' },
    { id:'wave',     f:'photo-1500375592092-40eb2168fd21', k:'ocean', t:'Волна', p:'Побережье' },
    { id:'starsmt',  f:'photo-1519681393784-d120267933ba', k:'night', t:'Звёздная ночь в горах', p:'Ночное небо' },
    { id:'milkyway', f:'photo-1419242902214-272b3f66ee7a', k:'night', t:'Млечный путь', p:'Тёмное небо' },
    { id:'aurora',   f:'photo-1531366936337-7c912a4589a7', k:'night', t:'Северное сияние', p:'Север' },
    { id:'citynight', f:'photo-1477959858617-67f85cf4f1df', k:'city', t:'Город вечером', p:'Мегаполис' },
    { id:'cityglow', f:'photo-1480714378408-67cf0d13bc1b', k:'city', t:'Огни большого города', p:'Ночной город' }
  ];
  const wurl = (w, width) => w.s === 'px' ? `https://images.pexels.com/photos/${w.f}/pexels-photo-${w.f}.jpeg?auto=compress&cs=tinysrgb&w=${width}` : `https://images.unsplash.com/${w.f}?auto=format&fit=crop&w=${width}&q=80`;
  const wp = [$('#wpA'), $('#wpB')], badW = new Map();
  let wpi = 0, wallTimer = null, wallIdx = 0, wallSig = '', curWall = null;
  const isBad = w => badW.has(w.id) && Date.now() - badW.get(w.id) < 300000;
  async function loadWall(w) {                          // сначала диск-кэш (быстро и без интернета), потом сеть
    if (isBad(w)) return null;
    let src = null;
    try { src = window.api ? await window.api.wallGet(w.id, wurl(w, 2560)) : wurl(w, 2560); } catch {}
    if (!src) { badW.set(w.id, Date.now()); return null; }
    return new Promise(res => { const im = new Image(); im.onload = () => res(src); im.onerror = () => { badW.set(w.id, Date.now()); res(null); }; im.src = src; });
  }
  async function showWall(w) {
    const src = await loadWall(w); if (!src) return false;
    const nx = wp[1 - wpi];
    nx.style.backgroundImage = `url("${src}")`;
    nx.classList.remove('kb'); void nx.offsetWidth; if (S.wallMotion) nx.classList.add('kb');
    nx.classList.add('on'); wp[wpi].classList.remove('on'); wpi = 1 - wpi;

  }

    if (!curWall || !S.wallCaption || S.wallMode === 'gradient') { c.classList.remove('on'); return; }

  function wallPool() {

    const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  let lastInput = Date.now();
  ['keydown', 'mousedown', 'mousemove', 'wheel', 'touchstart'].forEach(t => addEventListener(t, () => { lastInput = Date.now(); }, true));
  setInterval(() => {
    if (offing) return;
    if (offAt && Date.now() >= offAt) { offAt = 0; powerOff(); return; }

  }, 10000);
  let curT = 0;
  addEventListener('mousemove', () => { document.body.classList.remove('nocursor'); clearTimeout(curT); if (S.hideCursor) curT = setTimeout(() => document.body.classList.add('nocursor'), 3500); });
  let actx = null;
  function clickSnd(force) {
    if ((!S.uiSounds && !force) || sleeping) return;
    try {
      actx = actx || new AudioContext(); const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
      o.type = 'sine'; o.frequency.value = 920; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.05, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + .12);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + .14);
    } catch {}

  let toastT = 0, osdT = 0;

  function osd(html) { const o = $('#osd'); o.innerHTML = html; o.classList.add('on'); clearTimeout(osdT); osdT = setTimeout(() => o.classList.remove('on'), 1400); }

  /* ---------- Меню плитки: открыть, сдвинуть, убрать (долгое нажатие OK или правая кнопка) ---------- */
  const tilePop = $('#tilePop'); let menuKey = null;
  const tileEl = key => document.querySelector(`#apps .tile[data-key="${CSS.escape(key)}"]`);
  function openTileMenu(el) {
    const a = homeApps.find(h => h.url === el.dataset.key); if (!a) return;
    menuKey = a.url; $('#tmTitle').textContent = a.name; tilePop.classList.add('on'); setTimeout(() => $('#tmOpen').focus(), 60);
  }
  function closeTileMenu(refocus = true) { tilePop.classList.remove('on'); if (refocus && menuKey) { const f = tileEl(menuKey); if (f) f.focus(); } }
  function moveHome(key, d) {
    const i = homeApps.findIndex(h => h.url === key), j = i + d;
    if (i < 0 || j < 0 || j >= homeApps.length) { const f = tileEl(key); if (f) f.focus(); return; }
    [homeApps[i], homeApps[j]] = [homeApps[j], homeApps[i]]; saveHome(); renderApps(); const f = tileEl(key); if (f) f.focus();
  }
  function removeHome(key) {
    const a = homeApps.find(h => h.url === key); if (!a) return;

  $('#tmL').onclick = () => { const k = menuKey; closeTileMenu(false); moveHome(k, -1); };
  $('#tmR').onclick = () => { const k = menuKey; closeTileMenu(false); moveHome(k, 1); };
  $('#tmDel').onclick = () => { const k = menuKey; closeTileMenu(false); removeHome(k); };

  /* ---------- Геймпад: D‑pad / стик — стрелки, A — OK, B — назад, Start — домой ---------- */
  addEventListener('gamepadconnected', e => toast('Геймпад подключён: ' + e.gamepad.id.replace(/\s*\(.*$/, '').slice(0, 32)));
  const gpHeld = {};
  function gpKey(k) {
    if (sleeping) { wake(); return; }
    if (k === 'Home') { show('home'); return; }
    const el = document.activeElement || document.body;
    el.dispatchEvent(new KeyboardEvent('keydown', { key:k, bubbles:true, cancelable:true }));

  function gpLoop() {
    if (S.pad && !offing) {

        const b = i => g.buttons[i] && g.buttons[i].pressed, ax = g.axes, now = performance.now();

        for (const k in st) {
          if (st[k]) { const p = gpHeld[k]; if (!p || (k.startsWith('Arrow') && now - p.t > (p.rep ? 110 : 380))) { gpHeld[k] = { t:now, rep:!!p }; gpKey(k); } }
          else delete gpHeld[k];
        }
      }
    }
    requestAnimationFrame(gpLoop);
  }
  requestAnimationFrame(gpLoop);

  applySettings(); renderApps(); renderLibrary(); renderStart();
  osk.lang = S.oskLang;
  if (S.fullscreen && window.api) window.api.setFullscreen(true);

  const bootMs = S.anim ? 3000 : 50;
  setTimeout(() => { $('#veil').className = 'done'; $('#app').classList.remove('tv-on'); }, bootMs);
  setTimeout(() => focusDefault('home'), S.anim ? 1900 : 100);
  setTimeout(() => {                                     // приложение, которое открывается при включении
    if (!S.startApp) return;
    const a = homeApps.find(h => h.url === S.startApp);
    if (a) a.special ? openBrowser() : openSite(a.url);
  }, bootMs + 100);
